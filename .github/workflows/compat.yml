name: compat-window
# Boots the declared rolling window of dsh releases with this plugin installed
# (scripts/verify-dsh-compat.sh). Kept OFF ordinary PRs on purpose: each
# version installs dsh from npm, boots `dsh web` twice and probes the plugin
# API, which is minutes of billed windows time per entry. It runs weekly, on
# demand, and whenever the window file or the compat script itself changes.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'single dsh version to test (default: the whole window from ci/compat-window.json)'
        required: false
        type: string
  push:
    branches: [main, 'ci/**']
    paths:
      - ci/compat-window.json
      - scripts/verify-dsh-compat.sh
      - .github/workflows/compat.yml

permissions:
  contents: read

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  read-window:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.win.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: win
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          if [ -n "$REQUESTED" ]; then
            node -e 'console.log("versions="+JSON.stringify([process.argv[1]]))' "$REQUESTED" >> "$GITHUB_OUTPUT"
          else
            node -e 'const j=require("./ci/compat-window.json");console.log("versions="+JSON.stringify(j.window))' >> "$GITHUB_OUTPUT"
          fi

  compat:
    name: dsh ${{ matrix.version }}
    runs-on: windows-latest
    timeout-minutes: 40
    needs: read-window
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.read-window.outputs.versions) }}
    defaults:
      run:
        shell: bash
    env:
      COMPAT_PORT: 3091
      TEMP: /tmp/compat-work
      # the Windows spelling of the same directory (git-bash /tmp maps to the
      # runner user's temp). A fixed job-level value so the upload step has a
      # path even when an earlier step died before exporting anything.
      COMPAT_BASE_WIN: 'C:\Users\runneradmin\AppData\Local\Temp\compat-work'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: provide pnpm (the dsh plugin manager shells out to it; the bash PATH on windows runners lacks it)
        run: |
          npm i -g pnpm
          # run the version check OUTSIDE the checkout: pnpm >= 9 honours the
          # project's packageManager field ("npm@…") and refuses to run at all
          # inside this repo's root (ERR_PNPM_OTHER_PM_EXPECTED). dsh invokes
          # pnpm from the profile/case directories, where that guard does not
          # apply.
          (cd "$RUNNER_TEMP" && pnpm --version)
      - name: provision WSL1 Ubuntu (the plugin API must list at least one distro)
        uses: Vampire/setup-wsl@v3
        with:
          wsl-version: 1
          distribution: Ubuntu-24.04
          set-as-default: 'true'
          systemd: 'false'
          use-headless: 'false'
      - name: keep the instance warm so the 9P share stays visible
        run: wsl.exe -d Ubuntu-24.04 -- bash -c '(nohup sleep 1800 >/dev/null 2>&1 & echo kept-alive)'
      - name: pack and unpack the working tree (never test a published artifact for an unpublished commit)
        run: |
          mkdir -p /tmp/compat-pack /tmp/compat-work
          npm pack --ignore-scripts --pack-destination /tmp/compat-pack >/dev/null
          # `dsh plugin add` accepts a package name or a LOCAL DIRECTORY, not a
          # .tgz path (frame 1's three PLUGIN_ADD_FAIL lines: the previous step
          # pointed PLUGIN_REF at the tarball file itself).
          tar -xzf /tmp/compat-pack/dsh-wsl-workspace-*.tgz -C /tmp/compat-pack
          echo "PLUGIN_REF=$(cygpath -w /tmp/compat-pack/package)" >> "$GITHUB_ENV"
      - name: install → boot → probe → uninstall → reprobe for dsh ${{ matrix.version }}
        run: bash scripts/verify-dsh-compat.sh '${{ matrix.version }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compat-${{ matrix.version }}
          # verdicts + every step log only: the case tree also holds a full
          # `npm i @deepseek-ai/dsh` node_modules (frame 1's artifact was
          # 161 MB per version) and nothing in it is evidence.
          path: |
            ${{ env.COMPAT_BASE_WIN }}/**/verdicts.txt
            ${{ env.COMPAT_BASE_WIN }}/**/*.log
          retention-days: 14
